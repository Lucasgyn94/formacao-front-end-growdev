<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilizando Tabelas</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Tabela com bordas colapsadas</h2>
    <table class="custom-table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Lucas</td>
                <td>31</td>
                <td>Goiânia</td>
            </tr>
            <tr>
                <td>Thor</td>
                <td>1</td>
                <td>Goiânia</td>
            </tr>
            <tr>
                <td>Larissa</td>
                <td>20</td>
                <td>Goiânia</td>
            </tr>
            <tr>
                <td>Michelle</td>
                <td>25</td>
                <td>Belo Horizonte</td>
            </tr>
            <tr>
                <td>Edvaldo</td>
                <td>50</td>
                <td>Goianira</td>
            </tr>
            <tr>
                <td>Fernando</td>
                <td>40</td>
                <td>Goianira</td>
            </tr>
        </tbody>
    </table>
    <h2>Tabela com bordas separadas e espaçamentos</h2>
    <table class="custom-table custom-spacing">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>3000</td>
                <td>2</td>
            </tr>
             <tr>
                <td>Smartphone</td>
                <td>R$ 1500</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Headphone</td>
                <td>R$ 300</td>
                <td>8</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
