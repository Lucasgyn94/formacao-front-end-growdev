<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Positions</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Position: relative</h2>
    <div class="container">
        <div class="box-relative">Relativo</div>
        <div class="box-absolute">Absoluto</div>
        <div class="box-relative">Relativo</div>
    </div>

    <h2>Position: fixed</h2>
    <div class="content">
        <div class="box-fixed">
            Fixo na tela
        </div>
        <p>Role a página para ver o efeito</p>
    </div>

    <h2>Position: sticky</h2>
    <div class="content">
        <div class="box-sticky">
            Eu fico <strong>grudado</strong> no topo ao rolar
        </div>
        <p>Role a página para ver o efeito</p>
    </div>
    
</body>
</html>
