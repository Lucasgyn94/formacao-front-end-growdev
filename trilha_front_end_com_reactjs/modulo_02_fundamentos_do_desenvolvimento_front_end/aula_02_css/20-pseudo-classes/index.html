<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Pseudo-Classes</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Exemplo de Pseudo-Classes</h2>
    <h3>Inputs</h3>
    <input type="text" placeholder="Digite aqui...">
    <input type="text" placeholder="Desabilitado" disabled>
    <br>

    <input type="checkbox" id="check1">
    <label for="check1">Checkbox</label>

    <input type="checkbox" id="check2" checked>
    <label for="check2">Checkbox 2 (Selecionado)</label>
    <br>

    <input type="radio" id="radio1" name="group">
    <label for="radio1"> Opção 1</label>

    <input type="radio" name="group" id="radio2" checked>
    <label for="radio2">Opção 2 (Selecionada) </label>
    <br>

    <h3>Links</h3>
    <a href="https://example.com" target="_blank">Link para Example.com</a>
    <br>
    <a href="https://google.com" target="_blank">Link para Google</a>

    <h3>Container com Pseudo-Classes</h3>
    <div class="container">
        <p>Primeiro parágrafo (deve estar em negrito e verde).</p>
        <p>Segundo parágrafo.</p>
        <p>Terceiro parágrafo (deve estar em itálico e laranja).</p>
        <p>Quarto parágrafo.</p>
    </div>



</body>
</html>
