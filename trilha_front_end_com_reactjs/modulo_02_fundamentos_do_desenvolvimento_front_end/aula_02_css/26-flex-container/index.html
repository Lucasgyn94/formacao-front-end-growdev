<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Flex Container</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Exemplo de Flex Container Horizontal</h2>

    <!-- Flex Container Horizontal -->
    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
    </div>

    <h2>Exemplo de Flex Container Vertical</h2>

    <!-- Flex Container Vertical -->
    <div class="flex-column-container">
        <div class="flex-item-vertical">Item 1</div>
        <div class="flex-item-vertical">Item 2</div>
        <div class="flex-item-vertical">Item 3</div>
    </div>
    
</body>
</html>
