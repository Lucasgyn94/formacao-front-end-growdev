<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Container</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Exemplo de Grid Container</h2>

    <!-- Grid Container com quatro itens-->
     <div class="grid-container">
        <div class="grid-item grid-item-1">Item 1 (Coluna 1 a 2)</div>
        <div class="grid-item grid-item-2">Item 2 (Coluna 3)</div>
        <div class="grid-item grid-item-3">Item 3 (Coluna 1)</div>
        <div class="grid-item grid-item-4">Item 4 (Coluna 2 a 3)</div>
     </div>
</body>
</html>
