<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Flex Item</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h2>Exemplo de Flex Items com Diferentes Comportamentos</h2>

    <!-- Flex Container com três itens -->
    <div class="flex-container">
        <div class="flex-item flex-item-1">Item 1 (flex-grow: 1)</div>
        <div class="flex-item flex-item-2">Item 2 (flex-grow: 2)</div>
        <div class="flex-item flex-item-3">Item 3 (flex-shrink: 0, width: 200px)</div>
    </div>
    
</body>
</html>
