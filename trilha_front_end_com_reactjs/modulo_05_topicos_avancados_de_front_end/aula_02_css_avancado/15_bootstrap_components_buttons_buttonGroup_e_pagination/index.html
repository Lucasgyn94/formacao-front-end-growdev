<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/libs/bootstrap-5.3/bootstrap.min.css">
    <title>Bootstrap Components - Buttons, Button group e Pagination</title>
</head>
<body>
    <button type="button" class="btn btn-primary" disabled>Primary</button>
    <input type="submit" value="Clique aqui" class="btn btn-success" disabled>

    <div class="d-grid gap-2 mt-5">
        <button class="btn btn-primary" type="button">Button</button>
        <button class="btn btn-primary" type="button">Button 2</button>
    </div>

    <div class="btn-group mt-5" role="group" aria-label="Exemplo Básico">
        <button type="button" class="btn btn-primary">Left</button>
        <button type="button" class="btn btn-primary">Middle</button>
        <button type="button" class="btn btn-primary">Right</button>
    </div>

    <nav aria-label="Page navigation example">
        <ul class="pagination mt-3">
            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
    </nav>


    <!--Scripts JS-->    
    <script src="./assets/libs/bootstrap-5.3/bootstrap.bundle.min.js"></script>
    <script src="./index.js" defer></script>
</body>
</html>
