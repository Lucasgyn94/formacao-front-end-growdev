<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/libs/bootstrap-5.3/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style.css">
    <title>Exercício - Bootstrap Forms</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <form id="meu-form" class="needs-validation" novalidate>
                        <fieldset>
                            <legend>
                                <h1 class="text-center">Acessar o Sistema</h1>
                            </legend>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>

                                <div class="valid-feedback">
                                    Tudo Certo
                                </div>
                                <div class="invalid-feedback">
                                    Preencha corretamente o campo de e-mail!
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" required>
                                <div class="valid-feedback">
                                    Tudo Certo
                                </div>
                                <div class="invalid-feedback">
                                    Preencha corretamente o campo de senha!
                                </div>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="conectado">
                                <label class="form-check-label" for="conectado">Mantenha-me conectado</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </fieldset>
                    </form>
                </div>
                <div class="col-12">
                    <p class="text-center">
                        <small>Não tem conta? Cadastre-se</small>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!--SCRIPTS JS-->
    <script src="./assets/libs/bootstrap-5.3/bootstrap.bundle.min.js"></script>
    <script src="./index.js" defer></script>
</body>
</html>
