<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/libs/bootstrap-5.3/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style.css">
    <title>Bootstrap Components - Alerts, Toasts, Tooltips e Popovers</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 mb-3">
                <h2>Exemplo Alerts</h2>
                <div id="espacoAlerta"></div>
                <button type="button" class="btn btn-primary" id="btnAlerta">Mostrar Alerta</button>
            </div>        
            <hr>
            <div class="col-12 mb-2">
                <h2>Exemplo Toasts</strong></h2>
                <button type="button" class="btn btn-primary" id="btnNotificacao">Mostrar Notificação</button>

                <div class="toast-container position-fixed bottom-0 end-0 p-3">
                    <div id="notificacaoTempoReal" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                        <div class="toast-header">
                            <img src="..." class="rounded me-2" alt="...">
                            <strong class="me-auto">Bootstrap</strong>
                            <small>11 mins ago</small>
                            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                        <div class="toast-body">
                            Olá mundo! Essa é uma mensagem de notificação.
                        </div>
                    </div>
                </div>
            </div>
            <hr>
            
        
        </div>
    </div>

    

    <!--Scripts JS-->    
    <script src="./assets/libs/bootstrap-5.3/bootstrap.bundle.min.js"></script>
    <script src="./index.js" defer></script>
</body>
</html>
