<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/libs/bootstrap-5.3/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style.css">
    <title>Bootstrap Components - Card e Carousel</title>
</head>
<body>
<!--SITE GERADOR DE IMAGEM: https://picsum.photos/1200-->
    <main>
        <div class="container">
            <div class="card meuCard">
                <img src="https://picsum.photos/1200" class="card-img-top" alt="Foto aleatória">
                <div class="card-body">
                    <h1 class="card-title">Card title</h1>
                    <h6 class="card-subtitle mb-2 text-body-secondary">Card Subtitle</h6>

                    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
                    
                    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>

                    <button type="button" class="btn btn-danger">
                        <i class="bi bi-heart-fill"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="container w-50 mb-5 mt-5">
            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="https://picsum.photos/900" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="https://picsum.photos/1100" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="https://picsum.photos/1000" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Próximo</span>
                </button>
            </div>
        </div>
    </main>

    <!--Scripts JS-->    
    <script src="./assets/libs/bootstrap-5.3/bootstrap.bundle.min.js"></script>
    <script src="./index.js" defer></script>
</body>
</html>
