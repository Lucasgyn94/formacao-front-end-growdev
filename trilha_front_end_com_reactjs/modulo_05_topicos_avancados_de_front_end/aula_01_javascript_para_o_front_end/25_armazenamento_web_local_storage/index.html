<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armazenamento Web - Local Storage</title>
</head>
<body>
    <h1>Exemplo de local storage</h1>

    <label for="nome">Digite seu nome: </label>
    <input type="text" id="nome" placeholder="seu nome">

    <button id="btnSalvar">Salvar Nome</button>
    <button id="btnRemover">Remover Nome</button>
    <button id="btnLimpar">Limpar LocalStorage</button>

    <div id="display"></div>
    
    <script src="./index.js" defer></script>
</body>
</html>
